<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Lock In Flip Clock</title>
  <style>
    :root {
      --bg: #000;
      --card: #121212;
      --digit: #d8d8d8;
      --muted: #909090;
      --line: #050505;
      --radius: clamp(22px, 2.3vw, 40px);
      --gap: clamp(14px, 3vw, 52px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--digit);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100vw;
      min-height: 100svh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      cursor: default;
    }

    .shell {
      width: min(1180px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-1.5vh);
    }

    .date {
      margin-bottom: clamp(28px, 5vh, 66px);
      color: var(--muted);
      font-size: clamp(16px, 1.9vw, 30px);
      font-weight: 400;
      letter-spacing: -0.02em;
      text-align: center;
      white-space: nowrap;
    }

    .clock {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--gap);
      align-items: center;
    }

    .flip-card {
      position: relative;
      aspect-ratio: 0.93 / 1;
      min-width: 0;
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.012);
      perspective: 1200px;
    }

    .half,
    .flip-layer {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background: var(--card);
    }

    .top { top: 0; }
    .bottom { bottom: 0; }

    .half.top::after,
    .flip-layer.top::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--line);
      z-index: 8;
    }

    .digit-wrap {
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .top .digit-wrap { top: 0; }
    .bottom .digit-wrap { bottom: 0; }

    .digit {
      display: block;
      font-size: clamp(88px, 22vw, 280px);
      line-height: 0.9;
      font-weight: 680;
      letter-spacing: -0.075em;
      transform: translateX(-0.035em);
      color: var(--digit);
      font-variant-numeric: tabular-nums;
    }

    .meridiem {
      position: absolute;
      left: 8.3%;
      bottom: 7.5%;
      z-index: 20;
      font-size: clamp(13px, 2.1vw, 28px);
      line-height: 1;
      font-weight: 650;
      color: #d1d1d1;
      letter-spacing: -0.03em;
    }

    .flip-layer {
      z-index: 10;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-layer.top {
      top: 0;
      transform-origin: bottom;
    }

    .flip-layer.bottom {
      bottom: 0;
      transform-origin: top;
      transform: rotateX(90deg);
    }

    .flip-card.flipping .flip-layer.top {
      animation: foldUp 240ms cubic-bezier(.55,.08,.68,.53) forwards;
    }

    .flip-card.flipping .flip-layer.bottom {
      animation: foldDown 240ms 240ms cubic-bezier(.22,.61,.36,1) forwards;
    }

    @keyframes foldUp {
      0% { transform: rotateX(0deg); filter: brightness(1); }
      100% { transform: rotateX(-90deg); filter: brightness(.72); }
    }

    @keyframes foldDown {
      0% { transform: rotateX(90deg); filter: brightness(.7); }
      100% { transform: rotateX(0deg); filter: brightness(1); }
    }

    .message {
      margin-top: clamp(42px, 7vh, 90px);
      min-width: 4ch;
      max-width: min(90vw, 900px);
      padding: 6px 12px;
      color: var(--muted);
      font-size: clamp(15px, 1.7vw, 27px);
      font-weight: 400;
      letter-spacing: -0.02em;
      text-align: center;
      outline: none;
      border-radius: 8px;
      cursor: text;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message[contenteditable="true"] {
      user-select: text;
      -webkit-user-select: text;
      color: #d3d3d3;
      background: rgba(255,255,255,.06);
      box-shadow: 0 0 0 1px rgba(255,255,255,.12);
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: rgba(255,255,255,.34);
      font-size: 11px;
      letter-spacing: .02em;
      opacity: 0;
      transition: opacity 180ms ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .hint.show { opacity: 1; }

    @media (max-width: 760px) {
      .shell {
        width: min(94vw, 660px);
        transform: translateY(-1vh);
      }

      .clock { gap: clamp(8px, 2.7vw, 18px); }

      .flip-card {
        border-radius: clamp(14px, 4vw, 24px);
      }

      .digit {
        font-size: clamp(72px, 28vw, 190px);
        letter-spacing: -0.085em;
      }

      .date {
        margin-bottom: clamp(22px, 4vh, 38px);
        font-size: clamp(14px, 4vw, 21px);
      }

      .message {
        margin-top: clamp(34px, 6vh, 54px);
        font-size: clamp(14px, 4vw, 20px);
      }

      .meridiem {
        font-size: clamp(10px, 3.5vw, 18px);
      }
    }

    @media (max-width: 460px) and (orientation: portrait) {
      .shell { width: 96vw; }
      .clock { gap: 7px; }
      .digit { font-size: clamp(64px, 29vw, 132px); }
      .meridiem { left: 9%; bottom: 8.5%; }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      .shell { width: min(980px, 86vw); transform: none; }
      .date { margin-bottom: 16px; font-size: 16px; }
      .message { margin-top: 20px; font-size: 15px; }
      .flip-card { max-height: 58vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flip-card.flipping .flip-layer.top,
      .flip-card.flipping .flip-layer.bottom { animation-duration: 1ms; animation-delay: 0ms; }
    }
  </style>
</head>
<body>
  <main class="app" id="app" aria-label="Fullscreen flip clock. Double click the black background to toggle fullscreen.">
    <section class="shell">
      <div class="date" id="dateText">10 Aug 2026&nbsp; Mon</div>

      <div class="clock" aria-label="Current time">
        <div class="flip-card" id="hoursCard">
          <div class="half top"><div class="digit-wrap"><span class="digit current">12</span></div></div>
          <div class="half bottom"><div class="digit-wrap"><span class="digit current">12</span></div></div>
          <div class="meridiem" id="meridiem">PM</div>
        </div>

        <div class="flip-card" id="minutesCard">
          <div class="half top"><div class="digit-wrap"><span class="digit current">59</span></div></div>
          <div class="half bottom"><div class="digit-wrap"><span class="digit current">59</span></div></div>
        </div>

        <div class="flip-card" id="secondsCard">
          <div class="half top"><div class="digit-wrap"><span class="digit current">32</span></div></div>
          <div class="half bottom"><div class="digit-wrap"><span class="digit current">32</span></div></div>
        </div>
      </div>

      <div class="message" id="message" title="Double-click to edit">LOCK IN</div>
    </section>

    <div class="hint" id="hint"></div>
  </main>

  <script>
    (() => {
      const app = document.getElementById('app');
      const dateText = document.getElementById('dateText');
      const meridiem = document.getElementById('meridiem');
      const message = document.getElementById('message');
      const hint = document.getElementById('hint');

      const cards = {
        hours: document.getElementById('hoursCard'),
        minutes: document.getElementById('minutesCard'),
        seconds: document.getElementById('secondsCard')
      };

      const state = { hours: null, minutes: null, seconds: null };
      let hintTimer = null;

      function showHint(text) {
        hint.textContent = text;
        hint.classList.add('show');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hint.classList.remove('show'), 1500);
      }

      const savedMessage = localStorage.getItem('flipclock-message');
      if (savedMessage !== null) message.textContent = savedMessage || 'LOCK IN';

      function pad2(n) { return String(n).padStart(2, '0'); }

      function formatDate(d) {
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        return `${pad2(d.getDate())} ${months[d.getMonth()]} ${d.getFullYear()}\u00A0 ${days[d.getDay()]}`;
      }

      function setStatic(card, value) {
        card.querySelectorAll('.half .current').forEach(el => el.textContent = value);
      }

      function flipTo(card, oldValue, newValue) {
        if (oldValue === null || oldValue === newValue) {
          setStatic(card, newValue);
          return;
        }

        card.querySelectorAll('.flip-layer').forEach(el => el.remove());
        card.classList.remove('flipping');
        void card.offsetWidth;

        // Base halves reveal the new number.
        setStatic(card, newValue);

        // Front top starts on old number and folds upward.
        const oldTop = document.createElement('div');
        oldTop.className = 'flip-layer top';
        oldTop.innerHTML = `<div class="digit-wrap"><span class="digit">${oldValue}</span></div>`;

        // Front bottom starts hidden with the new number and folds down.
        const newBottom = document.createElement('div');
        newBottom.className = 'flip-layer bottom';
        newBottom.innerHTML = `<div class="digit-wrap"><span class="digit">${newValue}</span></div>`;

        card.append(oldTop, newBottom);
        card.classList.add('flipping');

        setTimeout(() => {
          oldTop.remove();
          newBottom.remove();
          card.classList.remove('flipping');
        }, 520);
      }

      function updateClock() {
        const now = new Date();
        const hour24 = now.getHours();
        const hour12 = hour24 % 12 || 12;
        const next = {
          hours: pad2(hour12),
          minutes: pad2(now.getMinutes()),
          seconds: pad2(now.getSeconds())
        };

        dateText.textContent = formatDate(now);
        meridiem.textContent = hour24 >= 12 ? 'PM' : 'AM';

        for (const key of Object.keys(cards)) {
          if (state[key] !== next[key]) {
            flipTo(cards[key], state[key], next[key]);
            state[key] = next[key];
          }
        }
      }

      updateClock();
      // Align updates tightly to the next second boundary.
      setTimeout(() => {
        updateClock();
        setInterval(updateClock, 1000);
      }, 1000 - (Date.now() % 1000) + 8);

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) {
              await document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
              document.documentElement.webkitRequestFullscreen();
            } else {
              showHint('Fullscreen is not supported by this browser');
              return;
            }
          } else {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          }
        } catch (_) {
          showHint('Fullscreen was blocked by the browser');
        }
      }

      // Desktop double-click anywhere on the black canvas, except the editable message.
      app.addEventListener('dblclick', (event) => {
        if (event.target.closest('.flip-card, .date, .message')) return;
        toggleFullscreen();
      });

      function beginMessageEdit(event) {
        event?.preventDefault();
        event?.stopPropagation();
        message.setAttribute('contenteditable', 'true');
        message.focus();

        const range = document.createRange();
        range.selectNodeContents(message);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function finishMessageEdit(save = true) {
        if (message.getAttribute('contenteditable') !== 'true') return;
        message.removeAttribute('contenteditable');
        const cleaned = message.textContent.replace(/\s+/g, ' ').trim();
        message.textContent = cleaned || 'LOCK IN';
        if (save) localStorage.setItem('flipclock-message', message.textContent);
        window.getSelection()?.removeAllRanges();
      }

      message.addEventListener('dblclick', beginMessageEdit);
      message.addEventListener('blur', () => finishMessageEdit(true));
      message.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          finishMessageEdit(true);
          message.blur();
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          const saved = localStorage.getItem('flipclock-message');
          message.textContent = saved || 'LOCK IN';
          finishMessageEdit(false);
          message.blur();
        }
      });

      // Touch support: two quick taps on background = fullscreen; two quick taps on message = edit.
      let lastBgTap = 0;
      let lastMsgTap = 0;
      const DOUBLE_TAP_MS = 320;

      app.addEventListener('touchend', (event) => {
        if (event.target.closest('.flip-card, .date, .message')) return;
        const now = Date.now();
        if (now - lastBgTap < DOUBLE_TAP_MS) {
          event.preventDefault();
          lastBgTap = 0;
          toggleFullscreen();
        } else {
          lastBgTap = now;
        }
      }, { passive: false });

      message.addEventListener('touchend', (event) => {
        const now = Date.now();
        if (now - lastMsgTap < DOUBLE_TAP_MS) {
          event.preventDefault();
          lastMsgTap = 0;
          beginMessageEdit(event);
        } else {
          lastMsgTap = now;
        }
      }, { passive: false });

      // Prevent accidental browser selection/context menu on the clock face.
      app.addEventListener('contextmenu', (event) => {
        if (message.getAttribute('contenteditable') !== 'true') event.preventDefault();
      });
    })();
  </script>
</body>
</html>
